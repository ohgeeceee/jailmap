server {
    listen 80;
    listen [::]:80;
    server_name jailmap.com www.jailmap.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jailmap-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 900 always;
        return 503 "JailMap is installed. HTTPS activation is waiting for domain DNS to point to this server. Please check back shortly.\n";
    }
}
