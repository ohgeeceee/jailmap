server {
    listen 80;
    listen [::]:80;
    server_name jailmap.com www.jailmap.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jailmap-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://jailmap.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jailmap.com;
    ssl_certificate /etc/letsencrypt/live/jailmap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jailmap.com/privkey.pem;
    access_log off;
    return 301 https://jailmap.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jailmap.com;
    ssl_certificate /etc/letsencrypt/live/jailmap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jailmap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JailMapSSL:10m;
    client_max_body_size 16k;
    client_body_timeout 15s;
    access_log off;
    error_log /var/log/nginx/jailmap-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:3109;
        proxy_http_version 1.1;
        proxy_set_header Host jailmap.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host jailmap.com;
        proxy_set_header X-JailMap-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
